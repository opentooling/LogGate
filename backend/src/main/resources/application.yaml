spring:
  application:
    name: loggate
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loggate}
    username: ${DATABASE_USER:loggate}
    password: ${DATABASE_PASSWORD:loggate}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  session:
    jdbc:
      # Liquibase owns the schema, including Spring Session's tables.
      initialize-schema: never
    timeout: ${SESSION_TIMEOUT:8h}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:loggate}
            client-secret: ${OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            # Explicit by default in deployment: behind an ingress the public
            # URL cannot be reliably inferred from the request, and a mismatched
            # redirect_uri is rejected by the provider.
            redirect-uri: ${OIDC_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope: openid,profile,email
        provider:
          keycloak:
            # Resolved at startup, so the application needs the issuer reachable
            # to boot. The chart waits for Keycloak before starting the app.
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/loggate}
            user-name-attribute: preferred_username

# How a namespace's owning team, and that team's group, are resolved.
loggate:
  loki:
    url: ${LOKI_URL:http://loki-gateway.observability.svc.cluster.local}
    tenant-id: ${LOKI_TENANT_ID:}
    query-limit: ${LOKI_QUERY_LIMIT:5000}
    timeout: ${LOKI_TIMEOUT:60s}
    # The stream label naming each log's source cluster, when Loki holds more
    # than one. Empty turns the cluster dimension off.
    cluster-label: ${LOKI_CLUSTER_LABEL:}
  windows:
    target-bytes: ${WINDOW_TARGET_BYTES:268435456}
    min-duration: ${WINDOW_MIN_DURATION:1m}
    max-duration: ${WINDOW_MAX_DURATION:1h}
    max-count: ${WINDOW_MAX_COUNT:5000}
  quotas:
    max-range: ${QUOTA_MAX_RANGE:2d}
    max-estimated-bytes: ${QUOTA_MAX_ESTIMATED_BYTES:53687091200}
    concurrent-per-user: ${QUOTA_CONCURRENT_PER_USER:2}
    concurrent-global: ${QUOTA_CONCURRENT_GLOBAL:10}
    daily-bytes-per-team: ${QUOTA_DAILY_BYTES_PER_TEAM:536870912000}
    budget-window: ${QUOTA_BUDGET_WINDOW:24h}
  execution:
    enabled: ${WORKERS_ENABLED:true}
    workers: ${WORKER_COUNT:4}
    lease: ${WORKER_LEASE:2m}
    max-attempts: ${WORKER_MAX_ATTEMPTS:3}
    retention: ${ARTIFACT_RETENTION:48h}
  storage:
    endpoint: ${S3_ENDPOINT:http://minio.observability.svc.cluster.local:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:loggate-exports}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    # How long a download link stays valid. Long enough to start a large
    # download, short enough that a link pasted into a chat stops working.
    presigned-url-lifetime: ${S3_PRESIGNED_URL_LIFETIME:30m}
    # WHEN_REQUIRED unless the store is AWS S3 itself: most S3-compatible
    # stores do not accept the trailing checksums the SDK adds by default.
    checksums: ${S3_CHECKSUMS:WHEN_REQUIRED}
    ca-certificate: ${S3_CA_CERTIFICATE:}
  oidc:
    ca-certificate: ${OIDC_CA_CERTIFICATE:}
  namespaces:
    enabled: ${NAMESPACES_ENABLED:true}
    label-key: ${TEAM_LABEL_KEY:xyz.com/team}
    group-template: ${TEAM_GROUP_TEMPLATE:ad-{team}-{env}}
    environment: ${ENVIRONMENT:dev}
    # This cluster's name in the cluster label, which team-label mode pins
    # every export to.
    cluster: ${CLUSTER_NAME:}
  access:
    # TEAM_LABEL: teams export the namespaces labelled as theirs, read from the
    # Kubernetes API. OPEN: every namespace in Loki, to holders of open-role.
    mode: ${ACCESS_MODE:TEAM_LABEL}
    # A client role on this application's OIDC client, held directly or through
    # a group. Required in OPEN mode.
    open-role: ${ACCESS_OPEN_ROLE:}
    discovery-window: ${ACCESS_DISCOVERY_WINDOW:7d}
    discovery-cache-ttl: ${ACCESS_DISCOVERY_CACHE_TTL:60s}

server:
  shutdown: graceful
  # The app sits behind an ingress, so the externally visible scheme, host and
  # port come from X-Forwarded-*. Without this the OAuth2 redirect_uri is built
  # from the internal request and will not match what is registered.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    liquibase: WARN
