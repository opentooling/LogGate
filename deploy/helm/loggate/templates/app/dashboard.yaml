{{- if .Values.metrics.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loggate.fullname" . }}-dashboard
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
    {{- with .Values.metrics.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  loggate.json: |-
    {{- .Files.Get "dashboards/loggate.json" | nindent 4 }}
{{- end }}
