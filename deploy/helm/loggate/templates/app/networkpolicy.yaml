{{- if .Values.networkPolicy.enabled }}
{{- /*
  Deliberately narrow. LogGate holds credentials for Loki and object storage
  and can read every namespace's metadata, so the blast radius of a compromise
  is worth bounding explicitly rather than relying on the cluster default.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loggate.fullname" . }}
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loggate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the ingress controller reaches the application.
    - from:
        {{- range .Values.networkPolicy.ingressFrom }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .namespaceSelector | nindent 14 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- with .Values.networkPolicy.metricsFrom }}
    # Whatever scrapes metrics, on the management port only.
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: management
          protocol: TCP
    {{- end }}
  egress:
    # DNS, or nothing else resolves. Where the resolver runs differs by
    # distribution: kube-dns on port 53 upstream, openshift-dns on 5353.
    {{- $dns := .Values.networkPolicy.dns }}
    {{- $openshift := include "loggate.openshift" . }}
    {{- $namespaces := $dns.namespaceSelector | default (ternary (dict "kubernetes.io/metadata.name" "openshift-dns") (dict) (eq $openshift "true")) }}
    {{- $pods := $dns.podSelector | default (ternary (dict "dns.operator.openshift.io/daemonset-dns" "default") (dict "k8s-app" "kube-dns") (eq $openshift "true")) }}
    {{- $ports := $dns.ports | default (ternary (list 5353) (list 53) (eq $openshift "true")) }}
    - to:
        - namespaceSelector:
            {{- with $namespaces }}
            matchLabels:
              {{- toYaml . | nindent 14 }}
            {{- else }} {}
            {{- end }}
          podSelector:
            matchLabels:
              {{- toYaml $pods | nindent 14 }}
      ports:
        {{- range $ports }}
        - port: {{ . }}
          protocol: UDP
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "loggate.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.keycloak.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "loggate.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: keycloak
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    # Loki, object storage, the identity provider and the Kubernetes API. These
    # are addresses rather than selectors because they are usually outside this
    # release, and often outside the cluster.
    {{- with .Values.networkPolicy.egressTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loggate.fullname" . }}-postgres
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loggate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    # The database is reachable from the application only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "loggate.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
      ports:
        - port: postgres
          protocol: TCP
{{- end }}
{{- end }}
