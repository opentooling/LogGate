{{- if .Values.networkPolicy.enabled }}
{{- /*
  Deliberately narrow. LogGate holds credentials for Loki and object storage
  and can read every namespace's metadata, so the blast radius of a compromise
  is worth bounding explicitly rather than relying on the cluster default.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loggate.fullname" . }}
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loggate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the ingress controller reaches the application.
    - from:
        {{- range .Values.networkPolicy.ingressFrom }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .namespaceSelector | nindent 14 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS, or nothing else resolves.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "loggate.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.keycloak.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "loggate.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: keycloak
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    # Loki, object storage, the identity provider and the Kubernetes API. These
    # are addresses rather than selectors because they are usually outside this
    # release, and often outside the cluster.
    {{- with .Values.networkPolicy.egressTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loggate.fullname" . }}-postgres
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loggate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    # The database is reachable from the application only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "loggate.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
      ports:
        - port: postgres
          protocol: TCP
{{- end }}
