apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "loggate.fullname" . }}
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
---
{{- /*
Only team-label mode reads the Kubernetes API. In open mode the logs may come
from clusters LogGate cannot reach at all, and it asks Loki instead, so it is
granted nothing here.
*/}}
{{- if and .Values.rbac.create (eq (include "loggate.accessMode" .) "TEAM_LABEL") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loggate.fullname" . }}-namespace-reader
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
rules:
  # The only cluster-wide permission LogGate needs: read namespace metadata to
  # learn which team owns which namespace. It never reads workloads, secrets or
  # pod logs through the API - logs come from Loki.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "loggate.fullname" . }}-namespace-reader
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "loggate.fullname" . }}-namespace-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "loggate.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
