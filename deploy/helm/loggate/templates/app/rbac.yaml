apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "loggate.fullname" . }}
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loggate.fullname" . }}-namespace-reader
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
rules:
  # The only cluster-wide permission LogGate needs: read namespace metadata to
  # learn which team owns which namespace. It never reads workloads, secrets or
  # pod logs through the API - logs come from Loki.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "loggate.fullname" . }}-namespace-reader
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "loggate.fullname" . }}-namespace-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "loggate.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
