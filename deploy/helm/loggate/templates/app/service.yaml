apiVersion: v1
kind: Service
metadata:
  name: {{ include "loggate.fullname" . }}
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    # Health and Prometheus metrics. In-cluster only: the Ingress and Route
    # send traffic to the http port alone.
    - name: management
      port: {{ .Values.metrics.port }}
      targetPort: management
  selector:
    {{- include "loggate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
