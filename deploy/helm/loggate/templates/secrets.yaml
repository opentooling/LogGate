apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loggate.secretName" . }}
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
  annotations:
    # The Secret is generated on first install and preserved afterwards, so a
    # plain `helm upgrade` never rotates the database password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  database-password: {{ include "loggate.databasePassword" . | b64enc | quote }}
  oidc-client-secret: {{ include "loggate.oidcClientSecret" . | b64enc | quote }}
  {{- if .Values.storage.accessKey }}
  storage-access-key: {{ .Values.storage.accessKey | b64enc | quote }}
  storage-secret-key: {{ .Values.storage.secretKey | b64enc | quote }}
  {{- end }}
