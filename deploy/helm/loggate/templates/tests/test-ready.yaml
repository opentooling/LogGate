apiVersion: v1
kind: Pod
metadata:
  name: {{ include "loggate.fullname" . }}-test-ready
  labels:
    {{- include "loggate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    {{- if not .Values.openShift }}
    runAsUser: 10001
    {{- end }}
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: curlimages/curl:latest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - http://{{ include "loggate.fullname" . }}:{{ .Values.service.port }}/actuator/health/readiness
