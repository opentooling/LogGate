# -- Image for the LogGate application.
image:
  repository: ghcr.io/opentooling/loggate
  # Defaults to the chart's appVersion, which CI sets to the sha-<commit> image
  # built from the same commit as the chart.
  tag: ""
  pullPolicy: IfNotPresent

# -- API replicas. Sessions are shared through PostgreSQL, so a login that
# starts on one pod and finishes on another works, and a rolling update does
# not interrupt one in flight.
replicaCount: 2

updateStrategy: RollingUpdate

# -- OpenShift. With enabled=true every pod leaves out its fixed runAsUser,
# runAsGroup and fsGroup, so the restricted-v2 SCC can assign them from the
# namespace's range; everything else it requires is already set. Pair it with
# route.enabled for a Route instead of an Ingress. (The older top-level
# `openShift: true` is still honoured.)
openshift:
  enabled: false

# -- How long startup may take before the pod is considered broken, as
# failureThreshold x 3 seconds.
startupProbe:
  failureThreshold: 100

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

service:
  port: 8080

ingress:
  enabled: true
  className: ""
  host: loggate.localtest.me
  annotations: {}
  tls: []

# -- An OpenShift Route for the application, in place of the Ingress. The OIDC
# callback URL is derived from its host.
route:
  enabled: false
  host: ""
  # The .zip download streams through the application and a large export takes
  # minutes. OpenShift's router closes a connection idle for 30s by default,
  # which would cut the download off partway through.
  timeout: 1h
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  annotations: {}

# -- In-cluster PostgreSQL. Point `externalDatabase` at a managed instance for
# production and set postgres.enabled=false.
postgres:
  enabled: true
  image: postgres:17-alpine
  database: loggate
  username: loggate
  storage: 8Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

externalDatabase:
  url: ""
  # Host is separate from the JDBC url because the wait-for-db init container
  # probes it with pg_isready before the application starts.
  host: ""
  username: ""
  existingSecret: ""
  passwordKey: password

# -- Secrets. Leave passwords empty to have the chart generate them once and
# keep them across upgrades.
secrets:
  databasePassword: ""

# -- Namespace to team to group resolution. Must match what the identity
# provider actually issues: the template renders the group name that owns a
# namespace labelled with `labelKey`.
# -- How callers are granted logs.
access:
  # teamLabel: a team exports the namespaces labelled as theirs (see
  #   `namespaces`), read from this cluster's Kubernetes API.
  # open: every namespace Loki holds logs for, from every cluster that ships
  #   to it, to anyone holding openRole. The Kubernetes API is not read and no
  #   RBAC is created, so LogGate needs no access to any cluster it serves.
  mode: teamLabel
  # A client role on LogGate's own OIDC client (oidc.clientId), held directly
  # or inherited through a group. Required in open mode; the chart refuses to
  # render open mode without one.
  openRole: ""
  # How far back to look in Loki for the clusters and namespaces to offer.
  discoveryWindow: 7d

# -- Team ownership, for access.mode=teamLabel.
namespaces:
  enabled: true
  labelKey: xyz.com/team
  groupTemplate: "ad-{team}-{env}"
  environment: dev
  # This cluster's name in loki.clusterLabel. Required when a cluster label is
  # set: the Kubernetes API can only vouch for its own cluster, so every
  # export in team-label mode is pinned to it.
  cluster: ""

# -- OIDC. Point issuerUri at an existing Keycloak in production and leave
# keycloak.enabled false.
oidc:
  issuerUri: ""
  # Public callback URL. Derived from the ingress host when empty; set it
  # explicitly whenever the browser-facing URL differs from the ingress host.
  redirectUri: ""
  clientId: loggate
  # Leave empty to reuse or generate one, like the database password.
  clientSecret: ""
  existingSecret: ""
  clientSecretKey: oidc-client-secret

# -- RBAC for reading namespace metadata, the only cluster-scoped permission
# LogGate needs. Only created in team-label mode; open mode reads nothing from
# the Kubernetes API.
rbac:
  create: true

# -- In-cluster Keycloak. Local convenience only: it runs in dev mode with
# ephemeral storage and seeded users. Production points oidc.issuerUri at a
# real Keycloak and leaves this disabled.
keycloak:
  enabled: false
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.7.4"
    pullPolicy: IfNotPresent
  realm: loggate
  adminPassword: admin
  clientSecret: loggate-local-secret
  # Public URL of Keycloak, and of the app, as the browser sees them.
  publicUrl: http://auth.localtest.me:8088
  appUrl: http://loggate.localtest.me:8088
  ingress:
    enabled: true
    host: auth.localtest.me
  # Teams to create groups for, rendered through namespaces.groupTemplate.
  teams:
    - platform
    - payments
  demoUserPassword: loggate
  # The group granted the open-mode client role in the demo realm, and who is
  # in it. Granted to the group rather than to users, as a real realm usually
  # does, so open mode is exercised the way it runs. bob, in a team but not
  # this group, is how the refusal is shown.
  roleGroup:
    name: log-exporters
    role: export-logs
    members: [alice, carol]
  # dave deliberately has no teams: the refusal path needs a fixture too.
  demoUsers:
    - username: alice
      teams: [platform]
    - username: bob
      teams: [payments]
    - username: carol
      teams: [platform, payments]
    - username: dave
      teams: []
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# -- Network policy. Off by default because it depends on the cluster
# enforcing NetworkPolicy at all; on where it does, it bounds what a
# compromised LogGate could reach.
networkPolicy:
  enabled: false
  # Where the cluster's DNS resolver runs. Left empty, it is upstream
  # Kubernetes' kube-dns on port 53, or with openshift.enabled, OpenShift's
  # openshift-dns on port 5353. Set these only for anything else. (Defaults
  # live in the template because Helm merges maps: a default selector here
  # could not be replaced, only added to, and would match nothing.)
  dns:
    namespaceSelector: {}
    podSelector: {}
    ports: []
  ingressFrom:
    - namespaceSelector:
        kubernetes.io/metadata.name: ingress-nginx
  # Where the application is allowed to connect. Loki, object storage, the
  # identity provider and the Kubernetes API all live here.
  egressTo: []
  #  - to:
  #      - namespaceSelector:
  #          matchLabels:
  #            kubernetes.io/metadata.name: observability
  #    ports:
  #      - port: 3100
  #        protocol: TCP

# -- Extra environment variables for the app container, e.g. to raise a log
# level without rebuilding the image.
extraEnv: []
#  - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
#    value: DEBUG

# -- Extra hosts resolved inside the app pod. Used locally so the application
# resolves the browser-facing Keycloak hostname to the ingress.
hostAliases: []

# -- Object storage for export artifacts. Leave the keys empty to use the
# instance's own credentials (IAM role, IRSA) instead of a secret.
storage:
  endpoint: http://minio.observability.svc.cluster.local:9000
  region: us-east-1
  bucket: loggate-exports
  accessKey: ""
  secretKey: ""
  existingSecret: ""
  # MinIO and ONTAP S3 address buckets by path unless DNS is set up for
  # virtual-hosted buckets.
  pathStyle: true
  # -- How long a presigned download link stays valid.
  presignedUrlLifetime: 30m
  # -- When the S3 client adds integrity checksums. whenRequired suits every
  # S3-compatible store (MinIO, NetApp ONTAP S3, StorageGRID); whenSupported is
  # the AWS SDK's own default and is for AWS S3 only.
  checksums: whenRequired
  # -- A certificate authority to trust for the storage endpoint, for stores
  # behind an internal CA. A Secret in this namespace holding a PEM bundle.
  caCertificate:
    secretName: ""
    key: ca.crt

# -- Workers and quotas.
execution:
  enabled: true
  workers: 4
  lease: 2m
  maxAttempts: 3
  retention: 48h

quotas:
  maxRange: 2d
  maxEstimatedBytes: 53687091200
  concurrentPerUser: 2
  concurrentGlobal: 10
  # How much one team may export within budgetWindow. Charged in full to every
  # team an export touches, and set to 0 to switch the budget off.
  dailyBytesPerTeam: 536870912000
  budgetWindow: 24h

# -- Upstream Loki read endpoint.
loki:
  url: http://loki-gateway.observability.svc.cluster.local
  tenantId: ""
  # The stream label naming the cluster each log came from, when Loki holds
  # more than one cluster's logs (commonly `cluster`, set as an external label
  # by each cluster's log shipper). Empty when it holds one. When set, the page
  # offers a choice of cluster.
  clusterLabel: ""

# -- Extra Kubernetes objects to deploy with the release, e.g. custom resources.
# Items can be YAML objects or strings; both are rendered with `tpl`, so template
# expressions like {{ include "loggate.fullname" $ }} and {{ .Release.Namespace }}
# work. CRDs for any custom resources must already be installed in the cluster.
extraObjects: []
#  - apiVersion: route.openshift.io/v1
#    kind: Route
#    metadata:
#      name: '{{ include "loggate.fullname" $ }}'
#    spec:
#      host: loggate.apps.example.com
#      to: { kind: Service, name: '{{ include "loggate.fullname" $ }}' }
#      port: { targetPort: http }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
