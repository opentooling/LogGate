# -- Image for the LogGate application.
image:
  repository: loggate
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# -- API replicas. Must stay at 1 until sessions are shared between pods: the
# OAuth2 authorization request lives in an in-memory session, so a login that
# starts on one pod and completes on another fails. See docs/ARCHITECTURE.md.
replicaCount: 1

# -- Recreate rather than RollingUpdate, for the same reason: a rolling update
# briefly runs two pods, and a login in flight across both of them fails.
updateStrategy: Recreate

# -- Extra pod/container hardening. Set openShift=true to drop the explicit
# uid/gid and let the restricted-v2 SCC assign them.
openShift: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

service:
  port: 8080

ingress:
  enabled: true
  className: ""
  host: loggate.localtest.me
  annotations: {}
  tls: []

# -- In-cluster PostgreSQL. Point `externalDatabase` at a managed instance for
# production and set postgres.enabled=false.
postgres:
  enabled: true
  image: postgres:17-alpine
  database: loggate
  username: loggate
  storage: 8Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

externalDatabase:
  url: ""
  # Host is separate from the JDBC url because the wait-for-db init container
  # probes it with pg_isready before the application starts.
  host: ""
  username: ""
  existingSecret: ""
  passwordKey: password

# -- Secrets. Leave passwords empty to have the chart generate them once and
# keep them across upgrades.
secrets:
  databasePassword: ""

# -- Namespace to team to group resolution. Must match what the identity
# provider actually issues: the template renders the group name that owns a
# namespace labelled with `labelKey`.
namespaces:
  enabled: true
  labelKey: xyz.com/team
  groupTemplate: "ad-{team}-{env}"
  environment: dev

# -- OIDC. Point issuerUri at an existing Keycloak in production and leave
# keycloak.enabled false.
oidc:
  issuerUri: ""
  # Public callback URL. Derived from the ingress host when empty; set it
  # explicitly whenever the browser-facing URL differs from the ingress host.
  redirectUri: ""
  clientId: loggate
  # Leave empty to reuse or generate one, like the database password.
  clientSecret: ""
  existingSecret: ""
  clientSecretKey: oidc-client-secret

# -- RBAC for reading namespace metadata. The only cluster-scoped permission
# LogGate needs.
rbac:
  create: true

# -- In-cluster Keycloak. Local convenience only: it runs in dev mode with
# ephemeral storage and seeded users. Production points oidc.issuerUri at a
# real Keycloak and leaves this disabled.
keycloak:
  enabled: false
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.7.4"
    pullPolicy: IfNotPresent
  realm: loggate
  adminPassword: admin
  clientSecret: loggate-local-secret
  # Public URL of Keycloak, and of the app, as the browser sees them.
  publicUrl: http://auth.localtest.me:8088
  appUrl: http://loggate.localtest.me:8088
  ingress:
    enabled: true
    host: auth.localtest.me
  # Teams to create groups for, rendered through namespaces.groupTemplate.
  teams:
    - platform
    - payments
  demoUserPassword: loggate
  # dave deliberately has no teams: the refusal path needs a fixture too.
  demoUsers:
    - username: alice
      teams: [platform]
    - username: bob
      teams: [payments]
    - username: carol
      teams: [platform, payments]
    - username: dave
      teams: []
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# -- Extra environment variables for the app container, e.g. to raise a log
# level without rebuilding the image.
extraEnv: []
#  - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
#    value: DEBUG

# -- Extra hosts resolved inside the app pod. Used locally so the application
# resolves the browser-facing Keycloak hostname to the ingress.
hostAliases: []

# -- Object storage for export artifacts. Leave the keys empty to use the
# instance's own credentials (IAM role, IRSA) instead of a secret.
storage:
  endpoint: http://minio.observability.svc.cluster.local:9000
  region: us-east-1
  bucket: loggate-exports
  accessKey: ""
  secretKey: ""
  existingSecret: ""
  # MinIO addresses buckets by path rather than by subdomain.
  pathStyle: true

# -- Workers and quotas.
execution:
  enabled: true
  workers: 4
  lease: 2m
  maxAttempts: 3
  retention: 48h

quotas:
  maxRange: 2d
  maxEstimatedBytes: 53687091200
  concurrentPerUser: 2
  concurrentGlobal: 10

# -- Upstream Loki read endpoint.
loki:
  url: http://loki-gateway.observability.svc.cluster.local
  tenantId: ""

# -- Extra Kubernetes objects to deploy with the release, e.g. custom resources.
# Items can be YAML objects or strings; both are rendered with `tpl`, so template
# expressions like {{ include "loggate.fullname" $ }} and {{ .Release.Namespace }}
# work. CRDs for any custom resources must already be installed in the cluster.
extraObjects: []
#  - apiVersion: route.openshift.io/v1
#    kind: Route
#    metadata:
#      name: '{{ include "loggate.fullname" $ }}'
#    spec:
#      host: loggate.apps.example.com
#      to: { kind: Service, name: '{{ include "loggate.fullname" $ }}' }
#      port: { targetPort: http }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
