# Alloy tails pod logs through the Kubernetes API (loki.source.kubernetes), so
# it needs no host path mounts and works the same on k3d as on a real cluster.
alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
        // Every stream names its cluster, as each cluster's shipper would when
        // several send to one Loki. deploy/local/seed-remote-cluster.sh pushes
        // a second cluster's logs alongside these.
        external_labels = {
          cluster = "k3d-loggate",
        }
      }
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

controller:
  type: daemonset

crds:
  create: false
