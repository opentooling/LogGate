adminUser: admin
adminPassword: loggate

persistence:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
        isDefault: true
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local

# Dashboards come from ConfigMaps labelled grafana_dashboard, in any
# namespace: LogGate's chart ships its own that way (metrics.dashboard).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    folder: /tmp/dashboards

ingress:
  enabled: true
  hosts:
    - grafana.localtest.me
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 128Mi

testFramework:
  enabled: false
