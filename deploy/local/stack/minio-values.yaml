# Object storage for LogGate export artifacts. Standalone, single drive: this
# is a laptop, not a durability exercise.
mode: standalone
replicas: 1

rootUser: loggate
rootPassword: loggate-local-dev

persistence:
  enabled: true
  size: 20Gi

buckets:
  - name: loggate-exports
    policy: none
    purge: false

resources:
  requests:
    cpu: 50m
    memory: 256Mi

# The S3 API needs its own ingress, not just the console: presigned download
# URLs are opened by the user's browser, so the endpoint they are signed
# against has to be one a browser can actually reach.
ingress:
  enabled: true
  hosts:
    - s3.localtest.me

consoleIngress:
  enabled: true
  hosts:
    - minio.localtest.me
