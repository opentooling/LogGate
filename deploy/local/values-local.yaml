image:
  repository: loggate
  pullPolicy: Never

ingress:
  enabled: true
  className: nginx
  host: loggate.localtest.me

postgres:
  enabled: true
  storage: 2Gi

loki:
  url: http://loki-gateway.observability.svc.cluster.local

resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 1Gi
