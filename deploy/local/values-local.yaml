image:
  repository: loggate
  pullPolicy: Never

# Two replicas locally as well, so the shared-session path is what gets
# exercised rather than an accident of running a single pod.
replicaCount: 2

ingress:
  enabled: true
  className: nginx
  host: loggate.localtest.me

postgres:
  enabled: true
  storage: 2Gi

# Local Keycloak with seeded teams and users. alice is platform, bob is
# payments, carol is both, and dave has no team at all so the refusal path has
# a fixture too.
keycloak:
  enabled: true
  publicUrl: http://auth.localtest.me:8088
  appUrl: http://loggate.localtest.me:8088
  ingress:
    enabled: true
    host: auth.localtest.me

namespaces:
  enabled: true
  labelKey: xyz.com/team
  groupTemplate: "ad-{team}-{env}"
  environment: dev

loki:
  url: http://loki-gateway.observability.svc.cluster.local

storage:
  endpoint: http://minio.observability.svc.cluster.local:9000
  bucket: loggate-exports
  accessKey: loggate
  secretKey: loggate-local-dev

quotas:
  # Small local ranges, so a mistake is cheap to notice.
  maxRange: 2d
  maxEstimatedBytes: 5368709120

resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 1Gi
