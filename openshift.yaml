# Source: loggate/templates/app/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loggate
  labels:
    app.kubernetes.io/name: loggate
    app.kubernetes.io/instance: loggate
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: loggate-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loggate
      app.kubernetes.io/instance: loggate
      app.kubernetes.io/component: app
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the ingress controller reaches the application.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS, or nothing else resolves. Where the resolver runs differs by
    # distribution: kube-dns on port 53 upstream, openshift-dns on 5353.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Loki, object storage, the identity provider and the Kubernetes API. These
    # are addresses rather than selectors because they are usually outside this
    # release, and often outside the cluster.
    - ports:
      - port: 8080
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: loki
    - ports:
      - port: 5432
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: databases
    - ports:
      - port: 443
        protocol: TCP
      to:
      - ipBlock:
          cidr: 10.20.0.0/16
